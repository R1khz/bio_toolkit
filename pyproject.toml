[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bio-toolkit"
version = "1.0.0"
description = "Linux-first CLI toolkit for retrieving and analyzing biological sequences"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Richard Yoel Flores Iuit", email = "yoelflores0211@gmail.com" }
]
dependencies = [
  "biopython>=1.85",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "questionary>=2.1.0",
  "python-dotenv>=1.1.0",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0",
  "ruff>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/R1khz/bio_toolkit"
Repository = "https://github.com/R1khz/bio_toolkit"
"Bug Tracker" = "https://github.com/R1khz/bio_toolkit/issues"

[project.scripts]
bio-toolkit = "bio_toolkit.cli:app"
btk = "bio_toolkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
